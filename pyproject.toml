[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-task-manager"
version = "1.1.0"
description = "TaskMate: a terminal task agent with real tools and SQLite storage."
requires-python = ">=3.11"
dependencies = ["openai>=2.0,<3", "httpx>=0.27,<1", "python-dotenv>=1.0,<2", "tzdata>=2025.1"]

[project.scripts]
task-agent = "task_manager.cli:main"

[tool.setuptools.packages.find]
include = ["task_manager*"]
